<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Rangs Lead Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/toast.js"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-slate-800">Forgot Password</h2>
            <p class="text-sm text-slate-500">Enter your email and we'll send you a reset link.</p>
        </div>

        <form id="forgotForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700">Email Address</label>
                <input type="email" id="email" required class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition duration-200">
                Send Reset Link
            </button>
            <p class="text-center text-sm text-slate-500">
                <a href="login.html" class="text-blue-600 hover:underline">Back to login</a>
            </p>
        </form>

        <!-- Shown after a successful submit — replaces the form so the person can't
             re-submit repeatedly by accident, and makes clear what to do next. -->
        <div id="successState" class="hidden text-center space-y-3">
            <svg class="mx-auto" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
            <p class="text-slate-700 font-medium">Check your email</p>
            <p class="text-sm text-slate-500">If an account exists for that address, a password reset link is on its way. It expires in 30 minutes.</p>
            <a href="login.html" class="inline-block text-blue-600 hover:underline text-sm">Back to login</a>
        </div>
    </div>

    <script>
        const API = 'http://localhost:5000/api';

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.textContent = 'Sending...';

            try {
                const res = await fetch(`${API}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                // The backend deliberately returns the same generic message whether or
                // not the email exists (prevents an attacker from using this form to
                // discover which emails are registered) — so we always show the
                // success state here rather than branching on res.ok for a 404-style case.
                document.getElementById('forgotForm').classList.add('hidden');
                document.getElementById('successState').classList.remove('hidden');
            } catch (err) {
                showToast('Something went wrong. Please try again.', 'error');
                btn.disabled = false;
                btn.textContent = 'Send Reset Link';
            }
        });
    </script>
</body>
</html>
