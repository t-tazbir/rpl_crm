<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Rangs Lead Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/toast.js"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">

        <!-- Checking state: shown briefly while we verify the token is still valid,
             before committing to showing either the form or the error view. -->
        <div id="checkingState" class="text-center py-6">
            <svg class="mx-auto animate-spin" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            <p class="text-sm text-slate-500 mt-3">Checking your reset link...</p>
        </div>

        <!-- Invalid/expired state -->
        <div id="invalidState" class="hidden text-center space-y-3">
            <svg class="mx-auto" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
            <p class="text-slate-700 font-medium">This link is invalid or has expired</p>
            <p class="text-sm text-slate-500">Reset links expire after 30 minutes for security. Request a new one below.</p>
            <a href="forgot-password.html" class="inline-block bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-700 transition text-sm">Request New Link</a>
        </div>

        <!-- The actual new-password form -->
        <div id="formState" class="hidden">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Set a New Password</h2>
                <p class="text-sm text-slate-500">Choose a new password for your account.</p>
            </div>
            <form id="resetForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700">New Password</label>
                    <input type="password" id="newPassword" required minlength="8" class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <p class="text-xs text-slate-400 mt-1">At least 8 characters.</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Confirm New Password</label>
                    <input type="password" id="confirmPassword" required minlength="8" class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition duration-200">
                    Reset Password
                </button>
            </form>
        </div>

        <!-- Success state -->
        <div id="successState" class="hidden text-center space-y-3">
            <svg class="mx-auto" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
            <p class="text-slate-700 font-medium">Password reset successfully</p>
            <a href="login.html" class="inline-block bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-700 transition text-sm">Go to Login</a>
        </div>
    </div>

    <script>
        const API = 'http://localhost:5000/api';
        const token = new URLSearchParams(window.location.search).get('token');

        function showState(id) {
            ['checkingState', 'invalidState', 'formState', 'successState'].forEach(s =>
                document.getElementById(s).classList.toggle('hidden', s !== id)
            );
        }

        (async function verifyOnLoad() {
            if (!token) { showState('invalidState'); return; }
            try {
                const res = await fetch(`${API}/auth/forgot-password/verify?token=${encodeURIComponent(token)}`);
                const data = await res.json();
                showState(data.valid ? 'formState' : 'invalidState');
            } catch (err) {
                showState('invalidState');
            }
        })();

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('submitBtn');

            if (newPassword !== confirmPassword) {
                showToast("Passwords don't match", 'error');
                return;
            }
            if (newPassword.length < 8) {
                showToast('Password must be at least 8 characters', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Resetting...';

            try {
                const res = await fetch(`${API}/auth/forgot-password/confirm`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Could not reset password');

                showState('successState');
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
