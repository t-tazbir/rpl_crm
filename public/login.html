<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rangs Lead Management System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/toast.js"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-slate-800">Rangs Properties Ltd</h2>
            <p class="text-sm text-slate-500">Lead Pipeline Management System</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700">Email Address</label>
                <input type="email" id="email" required class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700">Password</label>
                <input type="password" id="password" required class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition duration-200">
                Login
            </button>
            <p class="text-center text-sm text-slate-500">
                <a href="forgot-password.html" class="text-blue-600 hover:underline">Forgot your password?</a>
            </p>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    // Bug #6 fix: credentials: 'include' is required so the browser accepts
                    // and stores the Set-Cookie header the server sends back with the JWT.
                    // Without this, fetch() silently drops Set-Cookie on cross-origin requests.
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Login failed');
                }

                // Bug #6 fix: the JWT itself is now in an HttpOnly cookie the browser manages —
                // it's never present in `data` at all, so there's nothing to store here that
                // could be stolen via XSS. role/name are NOT secrets (they're only used to pick
                // which page to redirect to and what to show in the sidebar), so keeping those
                // two in localStorage is fine — the token is the only thing that mattered.
                localStorage.setItem('role', data.user.role);
                localStorage.setItem('name', data.user.name);

                showToast(`Welcome back, ${data.user.name.split(' ')[0]}!`, 'success', 1500);

                // Redirect based on role. TEAM_LEAD reuses leads.html (same as
                // SALES_MAN) — the difference in what they see is handled entirely
                // server-side by GET /api/leads (see leadController.getLeads), not
                // by giving them a separate page.
                setTimeout(() => {
                    if (data.user.role === 'SALES_MAN' || data.user.role === 'TEAM_LEAD') {
                        window.location.href = 'leads.html';
                    } else if(data.user.role === 'CLUSTER_HEAD'){
                        window.location.href = 'cluster-portal.html';
                    } else {    
                        window.location.href = 'dashboard.html';
                    }
                }, 400);

            } catch (err) {
                showToast(err.message, 'error');
            }
        });
    </script>
</body>
</html>
